
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Church Spot | Login</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #101f3c, #31547a);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }

  .login-card {
    background: #fff;
    padding: 32px;
    width: 100%;
    max-width: 380px;
    border-radius: 16px;
    box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25);
  }

  .login-card h1 {
    text-align: center;
    color: #102849;
    font-size: 27px;
    margin: 0 0 8px;
  }

  .subtitle {
    text-align: center;
    color: #6b7280;
    font-size: 14px;
    margin-bottom: 28px;
  }

  .form-group {
    margin-bottom: 20px;
  }

  .form-group label {
    display: block;
    margin-bottom: 7px;
    font-weight: bold;
    color: #26364a;
  }

  .form-group input {
    width: 100%;
    padding: 12px;
    border: 1px solid #cbd5e1;
    border-radius: 7px;
    font-size: 15px;
    outline: none;
  }

  .form-group input:focus {
    border-color: #d6a344;
    box-shadow: 0 0 0 3px rgba(214, 163, 68, 0.15);
  }

  button {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, #f5d58b, #e6ad43);
    color: #10213a;
    border: none;
    border-radius: 7px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
  }

  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
  }

  #error {
    color: #c62828;
    text-align: center;
    margin-top: 15px;
    min-height: 20px;
    font-size: 14px;
  }

  .footer {
    text-align: center;
    margin-top: 22px;
    color: #64748b;
    font-size: 12px;
  }
</style>
</head>

<body>

<form class="login-card" id="loginForm">
  <h1>Church Spot</h1>
  <p class="subtitle">Welcome back! Sign in to continue.</p>

  <div class="form-group">
    <label for="username">User ID</label>
    <input
      type="text"
      id="username"
      name="username"
      placeholder="Enter username"
      autocomplete="username"
      required>
  </div>

  <div class="form-group">
    <label for="age">Age</label>
    <input
      type="number"
      id="age"
      name="age"
      placeholder="Enter your age"
      min="1"
      max="120"
      required>
  </div>

  <div class="form-group">
    <label for="password">Password</label>
    <input
      type="password"
      id="password"
      name="password"
      placeholder="Enter your password"
      autocomplete="current-password"
      required>
  </div>

  <button type="submit">SIGN IN →</button>

  <div id="error" role="alert" aria-live="polite"></div>

  <div class="footer">
    Growing together in faith ✝
  </div>
</form>

<script>
  document.getElementById("loginForm").addEventListener("submit", function (e) {
    e.preventDefault();

    const user = document.getElementById("username")
                       .value.trim().toLowerCase();

    const pass = document.getElementById("password").value;
    const error = document.getElementById("error");

    // Accept only the two configured users.
    const validUsers = {
      "elan": "elan",
      "jeci": "jeci"
    };

    if (Object.prototype.hasOwnProperty.call(validUsers, user)
        && validUsers[user] === pass) {

      sessionStorage.setItem("loggedIn", "true");
      sessionStorage.setItem("username", user);

      window.location.href = "verses.html";

    } else {
      error.textContent = "Invalid User ID or Password.";
    }
  });
</script>

</body>
</html>
